name: Verify exact full external MCP suite
on:
  push:
    branches: [verification/ci-mailflow-mcp-full-v33]
permissions:
  contents: read
concurrency:
  group: verification-mcp-full-v33
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  external-full:
    if: github.repository == 'salmonumbrella/mailflow' && github.ref == 'refs/heads/verification/ci-mailflow-mcp-full-v33' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        id: checkout_payload
        with:
          ref: ${{ github.sha }}
          path: proposal
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        id: node
        with:
          node-version: '22.23.3'
          package-manager-cache: false
          token: ''
      - name: Verify exact 43 source files and frozen harness
        id: pin
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33"
          test ! -e "$RUNNER_TEMP/mcp-full-v33-logs"
          test ! -e "$RUNNER_TEMP/mcp-full-v33-home"
          mkdir "$RUNNER_TEMP/mcp-full-v33-logs" "$RUNNER_TEMP/mcp-full-v33-home"
          python3 "$payload/verify-source.py" verify "$payload" before > "$RUNNER_TEMP/mcp-full-v33-logs/pre-source.json"
      - name: Install unchanged external lock without lifecycle scripts
        id: external_ci
        if: ${{ !cancelled() && steps.pin.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: |
          nodebin=$(dirname "$(command -v node)")
          cd "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33/external"
          timeout --signal=TERM --kill-after=5s 300s env -i "PATH=$nodebin:/usr/bin:/bin" "HOME=$RUNNER_TEMP/mcp-full-v33-home" CI=true npm_config_jobs=1 npm_config_maxsockets=2 npm_config_fetch_retries=0 npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/mcp-full-v33-logs/external-install.log" 2>&1
      - name: Full npm test once with serial native files and nonroot loopback isolation
        id: batch
        if: ${{ !cancelled() && steps.external_ci.outcome == 'success' }}
        continue-on-error: true
        run: |
          nodebin=$(dirname "$(command -v node)")
          sudo unshare --net -- bash "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33/run-isolated.sh" \
            "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33" "$nodebin" \
            "$RUNNER_TEMP/mcp-full-v33-home" "$RUNNER_TEMP/mcp-full-v33-logs" "$(id -u)" "$(id -g)"
      - name: Verify source and lock bytes on every outcome
        id: post
        if: always()
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33/verify-source.py" verify \
            "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33" after > "$RUNNER_TEMP/mcp-full-v33-logs/post-source.json"
      - name: Clean only owned dependencies and isolated home with receipt
        id: cleanup
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-full-v33-logs"
          python3 "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33/verify-source.py" cleanup \
            "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33" "$RUNNER_TEMP/mcp-full-v33-home" "$RUNNER_TEMP/mcp-full-v33-logs"
      - name: Enforce all 196 native identities and complete receipts
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33/verify-source.py" enforce \
            "$GITHUB_WORKSPACE/proposal/verification/mcp-full-v33" "$RUNNER_TEMP/mcp-full-v33-logs"
      - name: Retain native logs and receipts even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-full-v33-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mcp-full-v33-logs
          if-no-files-found: error
          overwrite: false
          retention-days: 7
