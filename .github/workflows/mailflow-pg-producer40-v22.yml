name: MailFlow corrected producer40 SQL v22
on:
  push:
    branches: [verification/ci-mailflow-pg-producer40-v22]
    paths:
      - .github/workflows/mailflow-pg-producer40-v22.yml
      - verification/pg-producer40-v22/**
permissions:
  contents: read
concurrency:
  group: mailflow-managed-pg-producer40-v22
  cancel-in-progress: false
jobs:
  postgres:
    if: github.repository == 'salmonumbrella/mailflow' && github.ref == 'refs/heads/verification/ci-mailflow-pg-producer40-v22' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - name: Check out reviewed harness commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: salmonumbrella/mailflow
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: salmonumbrella/mailflow
          ref: e3ae3ecd27233b0d4421f1b082894430a5e86c3b
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Run all40 corrected source producer SQL cases
        run: python3 harness/verification/pg-producer40-v22/runner.py --source source --out pg-results --execute
      - name: Stop only a recorded owned service after cancellation or failure
        if: always()
        run: |
          if [ -d pg-results ]; then
            python3 harness/verification/pg-producer40-v22/runner.py --out pg-results --cleanup-owned
          fi
      - name: Retain native reports and sanitized logs on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mailflow-pg-producer40-v22-${{ github.run_id }}-${{ github.run_attempt }}
          path: pg-results/
          if-no-files-found: error
          overwrite: false
          retention-days: 14
