# Example nginx server for mailflow-mcp's HTTP mode on its own host name, in front of the container
# from deploy/docker-compose.mcp.yml (published on 127.0.0.1:8787). Replace mcp.example.com and the
# certificate paths. Only /mcp is passed on; every other path answers 404.
#
# There is deliberately no port-80 server for this name: a client set up with http:// would send its
# token unencrypted before any redirect could help, so configure clients with https:// only.

server {
    listen 443 ssl;
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/mcp.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /mcp {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # mailflow-mcp compares Host with MCP_ALLOWED_HOSTS; without this nginx would send 127.0.0.1:8787.
        proxy_set_header   Host $host;
        # One proxy hop, matching MCP_TRUST_PROXY_HOPS=1 in the compose overlay.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Answers are JSON, but a slow tool call (a body fetched from IMAP) must not be buffered or cut short.
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # mailflow-mcp refuses bodies over 1 MB itself; this stops anything much larger at the edge.
        client_max_body_size 2m;
        # The Authorization header carries the token: keep it out of any custom log_format.
    }

    location / {
        return 404;
    }
}

# Path-based alternative, without a separate host name: put the `location = /mcp` block above into
# MailFlow's existing server (for example mail.example.com), ahead of any catch-all location, and set
# MCP_ALLOWED_HOSTS=mail.example.com. Also answer the OAuth discovery paths there, which MailFlow's web
# app would otherwise answer with its index page:
#
#   location ^~ /.well-known/oauth-protected-resource   { return 404; }
#   location ^~ /.well-known/oauth-authorization-server { return 404; }
