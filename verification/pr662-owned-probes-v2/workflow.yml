name: MailFlow PR662 changed-source repair probes v2
on:
  push:
    branches: [verification/ci-mailflow-pr662-owned-probes-v2]
    paths:
      - .github/workflows/mailflow-pr662-owned-probes-v2.yml
      - verification/pr662-owned-probes-v2/**
permissions:
  contents: read
concurrency:
  group: mailflow-managed-pr662-owned-probes-v2
  cancel-in-progress: false
jobs:
  postgres:
    if: github.repository == 'salmonumbrella/mailflow' && github.ref == 'refs/heads/verification/ci-mailflow-pr662-owned-probes-v2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed harness commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: salmonumbrella/mailflow
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: salmonumbrella/mailflow
          ref: 123ba32ec5cd8c30f9c174201428ba9bcb06b433
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact pre-upgrade source for historical MOVE proof
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: salmonumbrella/mailflow
          ref: 6ef1a4deeb211f1817c30269350ef3fb0948785d
          path: legacy
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Run frozen changed-closure probes; retain failures without waiver
        run: python3 harness/verification/pr662-owned-probes-v2/runner.py --source source --legacy-source legacy --out pg-results --execute
      - name: Stop only a recorded owned service after cancellation or failure
        if: always()
        run: |
          if [ -d pg-results ]; then
            python3 harness/verification/pr662-owned-probes-v2/runner.py --out pg-results --cleanup-owned
          fi
      - name: Retain native reports and sanitized logs on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mailflow-pr662-owned-probes-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: pg-results/
          if-no-files-found: error
          overwrite: false
          retention-days: 14
