name: Observe pinned ARM image identity
on:
  push:
    branches: [verification/ci-mailflow-arm-images-v1]
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'salmonumbrella/mailflow' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe exact immutable images without app or service execution
        run: python3 -B verification/arm-image-observation/probe.py image-results
      - name: Preserve public image metadata on either outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-image-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-results/
          if-no-files-found: error
          retention-days: 7
